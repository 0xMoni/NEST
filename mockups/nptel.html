<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEST NPTEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nest.css">
<style>
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }

/* course tabs */
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 20px; width: fit-content; max-width: 100%; overflow-x: auto; }
.tab {
  min-height: 40px; padding: 0 16px; border: 0; border-radius: 9px; background: none; cursor: pointer; white-space: nowrap;
  font-family: var(--head); font-size: 13px; font-weight: 600; color: var(--muted); transition: background .15s, color .15s;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { background: var(--text); color: var(--bg); }

.course-meta { font-size: 14.5px; color: var(--muted); margin: 0 0 20px; }

.nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 26px; }
.num-box { padding: 16px 18px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
.num-box .v { font-family: var(--head); font-weight: 600; font-size: 26px; line-height: 1.1; margin-top: 8px; font-variant-numeric: tabular-nums; }
.num-box .v small { font-size: 14px; font-weight: 500; color: var(--muted); }
.num-box .meter { margin-top: 10px; }

/* week strip */
.weeks-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.weeks-head .hint { font-size: 13px; color: var(--faint); }
.weeks { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.wk {
  position: relative; padding: 12px 10px 11px; border-radius: 12px; text-align: center;
  background: var(--surface-2); border: 1px solid var(--border); cursor: default;
  transition: border-color .15s, transform .15s;
}
.wk:hover, .wk:focus-visible { border-color: var(--border-strong); transform: translateY(-2px); z-index: 4; }
.wk .n { font-family: var(--head); font-size: 10px; font-weight: 600; letter-spacing: .1em; color: var(--muted); }
.wk .sc { font-family: var(--head); font-weight: 600; font-size: 19px; margin: 6px 0 10px; font-variant-numeric: tabular-nums; }
.wk .vbar { height: 3px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.wk .vbar i { display: block; height: 100%; background: var(--gold); }
.wk.miss { background: var(--risk-soft); border-color: color-mix(in srgb, var(--risk) 55%, transparent); }
.wk.miss .sc { color: var(--risk); }
.wk.open { border-color: var(--gold); background: var(--gold-soft); }
.wk.open .sc, .wk.up .sc { font-size: 13px; margin: 10px 0 13px; }
.wk.open .sc { color: var(--gold); }
.wk.up { background: transparent; border-style: dashed; }
.wk.up .sc { color: var(--faint); }
.wk .tip {
  position: absolute; left: 50%; bottom: calc(100% + 8px); width: 200px; transform: translate(-50%, 4px);
  padding: 12px 14px; border-radius: 12px; text-align: left;
  background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow);
  font-size: 13.5px; color: var(--muted); line-height: 1.45;
  opacity: 0; visibility: hidden; transition: opacity .15s, transform .15s, visibility .15s; pointer-events: none;
}
.wk .tip b { display: block; color: var(--text); font-weight: 700; margin-bottom: 4px; }
.wk:hover .tip, .wk:focus-visible .tip { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
.weeks .wk:nth-child(6n+1) .tip { left: 0; transform: translate(0, 4px); }
.weeks .wk:nth-child(6n) .tip { left: auto; right: 0; transform: translate(0, 4px); }
.weeks .wk:nth-child(6n+1):hover .tip, .weeks .wk:nth-child(6n):hover .tip,
.weeks .wk:nth-child(6n+1):focus-visible .tip, .weeks .wk:nth-child(6n):focus-visible .tip { transform: none; }

/* details panel */
.panel { position: sticky; top: 24px; }
.person { display: flex; gap: 14px; align-items: center; margin-bottom: 20px; }
.person .ini { width: 48px; height: 48px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--head); font-weight: 600; font-size: 15px; background: var(--gold-soft); color: var(--gold); }
.person .nm { font-family: var(--head); font-weight: 600; font-size: 16px; }
.person .sm { font-size: 13.5px; color: var(--muted); }
.facts { margin: 0; display: grid; gap: 14px; }
.facts div { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.facts div:last-child { border-bottom: 0; padding-bottom: 0; }
.facts dt { font-size: 14px; color: var(--muted); }
.facts dd { margin: 0; font-family: var(--head); font-weight: 600; font-size: 13.5px; text-align: right; word-break: break-all; }
.copy { border: 0; background: none; padding: 0; cursor: pointer; color: inherit; font: inherit; display: inline-flex; gap: 6px; align-items: center; }
.copy svg { width: 13px; height: 13px; color: var(--faint); }
.copy:hover svg { color: var(--gold); }

.exam { margin-top: 20px; padding: 16px; border-radius: 12px; display: flex; gap: 12px; align-items: flex-start; }
.exam .mark { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; }
.exam .mark svg { width: 15px; height: 15px; }
.exam .t { font-family: var(--head); font-weight: 600; font-size: 14px; }
.exam .s { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.exam.yes { background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent); }
.exam.yes .mark { background: var(--ok); color: var(--bg); }
.exam.yes .t { color: var(--ok); }
.exam.no { background: var(--risk-soft); border: 1px solid color-mix(in srgb, var(--risk) 40%, transparent); }
.exam.no .mark { border: 2px solid var(--risk); }
.exam.no .t { color: var(--risk); }

@media (max-width: 1100px) {
  .layout { grid-template-columns: 1fr; }
  .panel { position: static; order: -1; }
}
@media (max-width: 640px) {
  .nums { grid-template-columns: 1fr; }
  .weeks { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .wk .tip { display: none; }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <svg class="side-swirl" id="swirl" aria-hidden="true"></svg>
    <a class="brand" href="dashboard.html">
      <div class="brand-word">NEST</div>
      <div class="brand-sub">NURTURING EDUCATION &amp; STUDENT TRACKING</div>
      <div class="brand-role">STUDENT</div>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard</a>
      <a href="attendance.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>
        Attendance</a>
      <a href="scorecard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        Scorecard</a>
      <a href="nptel.html" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M10 8.5v5l4-2.5z"/><path d="M8 21h8"/></svg>
        NPTEL</a>
      <a href="mentor.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5h5.5v4.5H18l-2 1.8z"/></svg>
        Mentor<span class="nav-badge" data-mentor-badge hidden></span></a>
      <a href="roadmap.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7"/></svg>
        Roadmap &amp; practice</a>
    </nav>
    <div class="side-foot">
      <a class="me" href="dashboard.html#profile">
        <span class="ini" aria-hidden="true">AS</span>
        <span><span class="who">Aarav Sharma</span><span class="meta">23AD014 · Sem 5 · A</span></span>
        <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </div>
  </aside>

  <main class="main">
    <header class="head">
      <h1>NPTEL</h1>
      <div class="head-actions">
        <button class="btn" type="button" id="exportBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
          Export PDF</button>
        <button class="icon-btn" type="button" id="themeBtn" aria-label="Switch to light theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <section aria-label="Course">
        <div class="tabs" role="tablist" aria-label="Your NPTEL courses" id="tabs"></div>
        <div class="card" role="tabpanel" id="coursePanel"></div>
      </section>

      <aside class="card panel" aria-label="Your NPTEL details" id="details"></aside>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="nest.js"></script>
<script>
(function () {
  var esc = NEST.esc;

  // Filled from the admin's SPOC sheet upload by the backend; shape only for now.
  var student = { name: 'Aarav Sharma', roll: '23AD014', usn: '1CR23AD014', branch: 'B.Tech AI & DS · Sem 5 · A' };

  // score: number = submitted (out of 100), null = missed, 'open' = this week, 'up' = not released yet
  var courses = [
    { id: 'cc', title: 'Cloud Computing', inst: 'IIT Kharagpur', run: 'Jul–Oct 2026', bestOf: 8, nptelId: 'NPTEL26CS43S5523014',
      exam: { applied: true, date: 'Sun 25 Oct', slot: 'Forenoon', centre: 'Bengaluru' },
      weeks: [
        { t: 'Introduction to cloud computing', due: '30 Jul', v: [5, 5], s: 80 },
        { t: 'Cloud computing architecture',    due: '6 Aug',  v: [6, 6], s: 90 },
        { t: 'Service models: IaaS, PaaS, SaaS', due: '13 Aug', v: [5, 5], s: 70 },
        { t: 'Virtualization',                  due: '20 Aug', v: [6, 6], s: 100 },
        { t: 'SLAs and cloud economics',        due: '27 Aug', v: [5, 2], s: null },
        { t: 'Resource management',             due: '3 Sep',  v: [6, 6], s: 85 },
        { t: 'Cloud security I',                due: '10 Sep', v: [5, 5], s: 60 },
        { t: 'Cloud security II',               due: '17 Sep', v: [5, 5], s: 90 },
        { t: 'Fog and edge computing',          due: '24 Sep', v: [6, 6], s: 75 },
        { t: 'Containers and Kubernetes',       due: '1 Oct',  v: [5, 4], s: 80 },
        { t: 'Serverless computing',            due: '8 Oct',  v: [5, 1], s: 'open' },
        { t: 'Case studies',                    due: '15 Oct', v: [4, 0], s: 'up' }
      ] },
    { id: 'dse', title: 'Data Science for Engineers', inst: 'IIT Madras', run: 'Aug–Oct 2026', bestOf: 6, nptelId: 'NPTEL26CS71S5523014',
      exam: { applied: false, closes: '10 Oct' },
      weeks: [
        { t: 'Course intro and R basics', due: '26 Aug', v: [7, 7], s: 100 },
        { t: 'Linear algebra',            due: '2 Sep',  v: [8, 8], s: 80 },
        { t: 'Statistics',                due: '9 Sep',  v: [6, 2], s: null },
        { t: 'Optimization',              due: '16 Sep', v: [7, 7], s: 70 },
        { t: 'Regression',                due: '23 Sep', v: [6, 6], s: 90 },
        { t: 'Classification',            due: '30 Sep', v: [7, 5], s: 60 },
        { t: 'Clustering',                due: '7 Oct',  v: [6, 3], s: 'open' },
        { t: 'Capstone case study',       due: '14 Oct', v: [5, 0], s: 'up' }
      ] }
  ];

  function closed(c) { return c.weeks.filter(function (w) { return typeof w.s === 'number' || w.s === null; }); }
  // Assignment score out of 25 from closed weeks (missed = 0), best `bestOf` weeks. Future weeks can only raise it.
  function assignScore(c) {
    var top = closed(c).map(function (w) { return w.s || 0; }).sort(function (a, b) { return b - a; }).slice(0, c.bestOf);
    return Math.round(top.reduce(function (a, b) { return a + b; }, 0) / (c.bestOf * 100) * 25 * 10) / 10;
  }
  function videos(c) {
    return c.weeks.filter(function (w) { return w.s !== 'up'; })
      .reduce(function (acc, w) { acc[0] += w.v[1]; acc[1] += w.v[0]; return acc; }, [0, 0]);
  }

  var sel = NEST.store.get('nptelCourse', courses[0].id);
  if (!courses.some(function (c) { return c.id === sel; })) sel = courses[0].id;
  function current() { return courses.filter(function (c) { return c.id === sel; })[0]; }

  function renderTabs() {
    document.getElementById('tabs').innerHTML = courses.map(function (c) {
      return '<button class="tab" role="tab" type="button" id="tab-' + c.id + '" data-id="' + c.id + '" aria-selected="' + (c.id === sel) + '"' +
        ' aria-controls="coursePanel" tabindex="' + (c.id === sel ? 0 : -1) + '">' + esc(c.title) + '</button>';
    }).join('');
  }

  function weekTile(w, i) {
    var cls = 'wk', score, state;
    if (w.s === null) { cls += ' miss'; score = '—'; state = 'Not submitted'; }
    else if (w.s === 'open') { cls += ' open'; score = 'Open'; state = 'Open · due ' + w.due; }
    else if (w.s === 'up') { cls += ' up'; score = 'Soon'; state = 'Not out yet'; }
    else { score = w.s; state = 'Scored ' + w.s + ' / 100'; }
    var label = 'Week ' + (i + 1) + ', ' + w.t + '. ' + state + '. Videos ' + w.v[1] + ' of ' + w.v[0] + '.';
    return '<div class="' + cls + '" tabindex="0" aria-label="' + esc(label) + '">' +
      '<div class="n">WEEK ' + (i + 1) + '</div><div class="sc">' + score + '</div>' +
      '<div class="vbar"><i style="width:' + (w.v[0] ? w.v[1] / w.v[0] * 100 : 0) + '%"></i></div>' +
      '<div class="tip" aria-hidden="true"><b>' + esc(w.t) + '</b>' + state + '<br>Videos watched ' + w.v[1] + ' / ' + w.v[0] + (w.s === 'up' ? '' : '<br>Due ' + w.due) + '</div>' +
      '</div>';
  }

  function renderCourse() {
    var c = current(), cl = closed(c), done = cl.filter(function (w) { return w.s !== null; }).length, v = videos(c);
    var panel = document.getElementById('coursePanel');
    panel.setAttribute('aria-labelledby', 'tab-' + c.id);
    panel.innerHTML =
      '<div class="course-meta">' + esc(c.inst) + ' · ' + c.weeks.length + ' weeks · ' + c.run + '</div>' +
      '<div class="nums">' +
        '<div class="num-box"><div class="eyebrow">Assignment score</div><div class="v">' + assignScore(c).toFixed(1) + ' <small>/ 25</small></div></div>' +
        '<div class="num-box"><div class="eyebrow">Assignments done</div><div class="v">' + done + ' <small>/ ' + cl.length + '</small></div></div>' +
        '<div class="num-box"><div class="eyebrow">Videos watched</div><div class="v">' + v[0] + ' <small>/ ' + v[1] + '</small></div>' +
          '<div class="meter"><i style="width:' + (v[0] / v[1] * 100) + '%"></i></div></div>' +
      '</div>' +
      '<div class="weeks-head"><span class="eyebrow">Week by week</span><span class="hint">Hover a week for details</span></div>' +
      '<div class="weeks">' + c.weeks.map(weekTile).join('') + '</div>';
  }

  function renderDetails() {
    var c = current(), e = c.exam;
    var exam = e.applied
      ? '<div class="exam yes"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>' +
          '<div><div class="t">Applied for exam</div><div class="s">' + e.date + ' · ' + e.slot + ' · ' + esc(e.centre) + '</div></div></div>'
      : '<div class="exam no"><span class="mark" aria-hidden="true"></span>' +
          '<div><div class="t">Not applied for exam</div><div class="s">Registration closes ' + e.closes + '</div></div></div>';
    document.getElementById('details').innerHTML =
      '<div class="person"><span class="ini" aria-hidden="true">AS</span><div><div class="nm">' + esc(student.name) + '</div><div class="sm">' + esc(student.branch) + '</div></div></div>' +
      '<dl class="facts">' +
        '<div><dt>Roll number</dt><dd>' + student.roll + '</dd></div>' +
        '<div><dt>USN</dt><dd>' + student.usn + '</dd></div>' +
        '<div><dt>NPTEL ID</dt><dd><button class="copy" type="button" data-copy="' + c.nptelId + '" aria-label="Copy NPTEL ID ' + c.nptelId + '">' + c.nptelId +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button></dd></div>' +
      '</dl>' + exam;
  }

  function select(id, focus) {
    sel = id; NEST.store.set('nptelCourse', id);
    renderTabs(); renderCourse(); renderDetails();
    if (focus) document.getElementById('tab-' + id).focus();
  }

  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.tab'); if (b) select(b.dataset.id);
  });
  document.getElementById('tabs').addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var i = courses.findIndex(function (c) { return c.id === sel; });
    var n = (i + (e.key === 'ArrowRight' ? 1 : -1) + courses.length) % courses.length;
    e.preventDefault(); select(courses[n].id, true);
  });
  document.getElementById('details').addEventListener('click', function (e) {
    var b = e.target.closest('.copy'); if (!b) return;
    var id = b.dataset.copy;
    (navigator.clipboard ? navigator.clipboard.writeText(id) : Promise.reject())
      .then(function () { NEST.toast('NPTEL ID copied'); }, function () { NEST.toast(id); });
  });
  select(sel);

  /* ---- PDF: every course, plus the student's details ---- */
  document.getElementById('exportBtn').addEventListener('click', function () {
    var applied = courses.filter(function (c) { return c.exam.applied; }).length;
    NEST.exportPDF({
      filename: 'NEST-nptel.pdf',
      title: 'NPTEL',
      subtitle: student.name + ' - Roll no. ' + student.roll + ' - USN ' + student.usn + ' - ' + student.branch,
      stats: [
        { label: 'Courses', value: String(courses.length) },
        { label: 'Exam applied', value: applied + ' / ' + courses.length, tone: applied < courses.length ? 'risk' : 'ok',
          note: applied < courses.length ? 'Some not applied yet' : 'All applied' }
      ],
      sections: courses.map(function (c) {
        var tones = [];
        var body = c.weeks.map(function (w, i) {
          tones.push(w.s === null ? 'risk' : w.s === 'up' ? 'muted' : null);
          var st = w.s === null ? 'Not submitted' : w.s === 'open' ? 'Open' : w.s === 'up' ? 'Not out yet' : w.s + ' / 100';
          return ['W' + (i + 1), w.t, w.v[1] + ' / ' + w.v[0], st, w.due];
        });
        return { heading: c.title + ' (' + c.inst + ')',
          note: 'NPTEL ID ' + c.nptelId + ' - assignments ' + assignScore(c).toFixed(1) + ' / 25 - ' +
            (c.exam.applied ? 'exam ' + c.exam.date : 'exam not applied'),
          head: ['Week', 'Topic', 'Videos', 'Assignment', 'Due'], body: body, tones: tones, toneCols: [3],
          widths: { 0: 44, 2: 60, 3: 90, 4: 60 } };
      })
    });
  });
})();
</script>
</body>
</html>
