<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEST · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Newsreader:ital,wght@0,300;0,400;1,300&display=swap">
<link rel="stylesheet" href="css/login.css">
<script>try { var t = localStorage.getItem('nest-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body>
<div class="page">
  <!-- BRAND -->
  <section class="brand" id="brand">
    <canvas class="weave" id="weave" aria-hidden="true"></canvas>
    <img class="logo" src="assets/nest-logo.png" alt="NEST — Nurturing Education and Student Tracking" width="274" height="246">
    <h2 class="statement">Every class, every mark, every student — <em>in one place.</em></h2>
    <p class="brandFoot">© 2026 NEST</p>
  </section>

  <!-- FORM -->
  <section class="side">
    <button type="button" class="theme" id="theme" title="Switch theme" aria-label="Switch theme"></button>
    <div class="formWrap" id="wrap">
      <h1 class="title rise">Sign in</h1>
      <p class="lede rise d1">Welcome back.</p>
      <form class="form" id="f" novalidate>
        <div class="alert" id="alert" role="alert" aria-live="polite" hidden>
          <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.4v4.3M8 11.2v.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span id="alertText"></span>
        </div>
        <div class="field rise d1">
          <label for="email">Email</label>
          <div class="control"><input type="text" id="email" placeholder="you@example.com" autocomplete="username" spellcheck="false" required></div>
        </div>
        <div class="field rise d2">
          <label for="password">Password</label>
          <div class="control hasToggle">
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="reveal" id="reveal" aria-label="Show password">Show</button>
          </div>
          <p class="caps" id="caps" hidden>Caps Lock is on</p>
        </div>
        <button type="submit" class="submit rise d4" id="go">Log in</button>
      </form>
    </div>
  </section>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/api.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement;

  /* ---- theme: follows the OS until a choice is pinned ---- */
  function isDark() { var p = root.getAttribute('data-theme'); return p ? p === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
  function paintToggle() {
    $('theme').innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
      (isDark() ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M21.4 12h-2.2M4.8 12H2.6M18.6 5.4 17 7M7 17l-1.6 1.6M18.6 18.6 17 17M7 7 5.4 5.4"/>' : '<path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z"/>') + '</svg>';
  }
  $('theme').addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark'; root.setAttribute('data-theme', next);
    try { localStorage.setItem('nest-theme', next); } catch (e) {}
    paintToggle(); drawWeave();
  });

  /* ---- woven background (same drawing as the main app) ---- */
  function seeded(seed) { var a = seed | 0; return function () { a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function drawWeave() {
    var cv = $('weave'), brand = $('brand'), ctx = cv.getContext('2d'); if (!ctx) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2), r = brand.getBoundingClientRect();
    var size = Math.ceil(Math.max(r.width, r.height) * 1.6) || 900;
    cv.width = size * dpr; cv.height = size * dpr; cv.style.width = cv.style.height = size + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, size, size);
    var cs = getComputedStyle(root), rgb = cs.getPropertyValue('--weave').trim(), base = parseFloat(cs.getPropertyValue('--weave-alpha')) || 0.3;
    var rnd = seeded(20260929), cx = size / 2, cy = size / 2; ctx.lineCap = 'round';
    function strand(count, minR, spanR, wBase, wVar, aMin, aVar, bowScale, steps) {
      for (var i = 0; i < count; i++) {
        var start = rnd() * Math.PI * 2, radius = minR + rnd() * spanR, span = 0.45 + rnd() * 1.7, bow = (rnd() - 0.5) * size * bowScale;
        ctx.beginPath(); ctx.lineWidth = wBase + rnd() * wVar; ctx.strokeStyle = 'rgba(' + rgb + ',' + (base * (aMin + rnd() * aVar)) + ')';
        for (var s = 0; s <= steps; s++) {
          var t = s / steps, th = start + span * t, rr = radius + Math.sin(t * Math.PI) * bow, x = cx + Math.cos(th) * rr, y = cy + Math.sin(th) * rr * 0.86;
          if (s) ctx.lineTo(x, y); else ctx.moveTo(x, y);
        }
        ctx.stroke();
      }
    }
    strand(240, size * 0.14, size * 0.34, 0.45, 1.45, 0.28, 0.72, 0.055, 30);
    strand(70, 0, size * 0.15, 0.35, 0.85, 0.14, 0.28, 0.04, 24);
  }
  var rt; addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(drawWeave, 180); });

  /* ---- form ---- */
  var email = $('email'), pw = $('password'), alertBox = $('alert');
  pw.addEventListener('keyup', caps); pw.addEventListener('keydown', caps); pw.addEventListener('blur', function () { $('caps').hidden = true; });
  function caps(e) { $('caps').hidden = !(e.getModifierState && e.getModifierState('CapsLock')); }
  $('reveal').addEventListener('click', function () {
    var show = pw.type === 'password'; pw.type = show ? 'text' : 'password';
    $('reveal').textContent = show ? 'Hide' : 'Show'; pw.focus();
  });
  function fail(text, field) {
    $('alertText').textContent = text; alertBox.hidden = false;
    field.setAttribute('aria-invalid', 'true'); field.focus();
    var w = $('wrap'); w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake');
  }
  [email, pw].forEach(function (i) { i.addEventListener('input', function () { i.removeAttribute('aria-invalid'); alertBox.hidden = true; }); });

  $('f').addEventListener('submit', async function (e) {
    e.preventDefault(); alertBox.hidden = true;
    var v = email.value.trim();
    if (!v || !pw.value) return fail('Enter your email and your password.', v ? pw : email);
    if (v.indexOf('@') < 0) return fail('Sign-in with a USN is not available on this page yet. Use your college email.', email);
    var go = $('go'); go.disabled = true; go.textContent = 'Signing in';
    var r = await NEST.sb.auth.signInWithPassword({ email: v.toLowerCase(), password: pw.value });
    go.disabled = false; go.textContent = 'Log in';
    // One message for every failure, so it can't be used to find out who has an account.
    if (r.error) return fail("Those details don't match an account.", pw);
    location.href = 'faculty/index.html';
  });

  paintToggle();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawWeave);
  drawWeave();
})();
</script>
</body>
</html>
