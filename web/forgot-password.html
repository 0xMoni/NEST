<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEST · Forgot password</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Newsreader:ital,wght@0,300;0,400;1,300&display=swap">
<link rel="stylesheet" href="css/login.css">
<script>try { var t = localStorage.getItem('nest-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body>
<div class="page">
  <section class="brand" id="brand">
    <canvas class="weave" id="weave" aria-hidden="true"></canvas>
    <img class="logo" src="assets/nest-logo.png" alt="NEST — Nurturing Education and Student Tracking" width="274" height="246">
    <h2 class="statement">Every class, every mark, every student — <em>in one place.</em></h2>
    <p class="brandFoot">© 2026 NEST</p>
  </section>

  <section class="side">
    <button type="button" class="theme" id="theme" title="Switch theme" aria-label="Switch theme"></button>
    <div class="formWrap" id="wrap">
      <h1 class="title rise">Forgot your password?</h1>
      <p class="lede rise d1">Enter your college email and we'll send you a link to set a new one.</p>
      <form class="form" id="f" novalidate>
        <div class="alert" id="alert" role="alert" aria-live="polite" hidden>
          <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.4v4.3M8 11.2v.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span id="alertText"></span>
        </div>
        <div class="field rise d1">
          <label for="email">College email</label>
          <div class="control"><input type="text" id="email" placeholder="you@eastpoint.ac.in" autocomplete="username" spellcheck="false" required></div>
        </div>
        <button type="submit" class="submit rise d3" id="go">Send reset link</button>
        <div class="row rise d4"><span></span><a href="login.html">Back to sign in</a></div>
      </form>
    </div>
  </section>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  var $ = NEST.$, email = $('email');
  if (NEST.param('expired') === '1') AUTH.show('That link has expired or was already used. Ask for a new one below.');

  $('f').addEventListener('submit', async function (e) {
    e.preventDefault(); AUTH.hide();
    var v = email.value.trim().toLowerCase();
    if (!v) return AUTH.fail('Enter your college email.', email);
    if (v.indexOf('@') < 0) return AUTH.fail('Resetting by USN is not available yet. Use your college email.', email);
    var go = $('go'); go.disabled = true; go.textContent = 'Sending…';
    var r = await NEST.sb.auth.resetPasswordForEmail(v, { redirectTo: NEST.url('reset-password.html') });
    go.disabled = false; go.textContent = 'Send reset link';
    // The reply is the same whether or not the account exists: saying "no such
    // email" would tell anyone who is enrolled. A failure still reaches the
    // console, where whoever set up email can see it.
    if (r.error) console.error('[forgot-password] Supabase refused to send:', r.error.message);
    if (r.error && /rate|seconds/i.test(r.error.message)) return AUTH.fail('Too many requests. Wait a minute and try again.', email);
    AUTH.show('If that address has an account, a reset link is on its way. Check your inbox and spam folder.', true);
    email.value = '';
  });
})();
</script>
</body>
</html>
