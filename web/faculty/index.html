<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEST · Teacher home</title>
<link rel="stylesheet" href="../css/nest.css"><link rel="stylesheet" href="../css/web.css">
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div><h1 id="hello">Hello</h1><p class="sub" id="sub"></p></div>
    <button class="btn ghost" onclick="NEST.signOut()">Sign out</button>
  </div>
  <div id="nav"></div>
  <div id="app"><p class="dim">Loading…</p></div>
</div>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../js/api.js"></script>
<script>
(async function () {
  var sb = NEST.sb, esc = NEST.esc, app = document.getElementById('app');
  var me = await NEST.requireRole('faculty');
  NEST.nav('index');

  // Placeholder period times, same as the main app until the college confirms theirs.
  var PERIODS = [[1, '09:00', '09:55'], [2, '09:55', '10:50'], [3, '11:10', '12:05'], [4, '12:05', '13:00'], [5, '13:45', '14:40'], [6, '14:40', '15:35']];
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var now = new Date(), dow = now.getDay();
  var today = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  var mins = now.getHours() * 60 + now.getMinutes();
  function toMin(t) { return Number(t.slice(0, 2)) * 60 + Number(t.slice(3)); }
  function running(n) { var p = PERIODS[n - 1]; return p && mins >= toMin(p[1]) && mins < toMin(p[2]); }

  document.getElementById('hello').textContent = 'Hello, ' + (me.full_name || '').split(' ').slice(-1)[0];
  document.getElementById('sub').textContent = DAYS[dow] + ', ' + now.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' });

  // Row-level security means every query below returns only this teacher's rows.
  var res = await Promise.all([
    sb.from('timetable_slots').select('day_of_week, period, assignment_id, faculty_assignments!inner(sections!inner(dept, semester, name), subjects!inner(code, name))').eq('day_of_week', dow).order('period'),
    sb.from('attendance_sessions').select('assignment_id, period').eq('held_on', today),
    sb.from('assessments').select('id', { count: 'exact', head: true }).eq('published', false),
    sb.from('profile_edit_requests').select('id', { count: 'exact', head: true }).eq('status', 'pending')
  ]);
  var slots = res[0].data || [], marked = new Set((res[1].data || []).map(function (m) { return m.assignment_id + ':' + m.period; }));
  var drafts = res[2].count || 0, requests = res[3].count || 0;

  var classes = slots.length ? '<table><tbody>' + slots.map(function (s) {
    var fa = s.faculty_assignments, ok = marked.has(s.assignment_id + ':' + s.period), p = PERIODS[s.period - 1];
    return '<tr class="' + (running(s.period) ? 'now' : '') + '"><td>P' + s.period + '</td><td class="dim">' + (p ? p[1] + '–' + p[2] : '') + '</td><td>' +
      esc(fa.subjects.name) + '</td><td class="dim">' + esc(fa.sections.dept) + '-' + fa.sections.semester + esc(fa.sections.name) + '</td><td>' +
      (ok ? '<span class="badge ok">Marked</span>' : '<a href="attendance.html?a=' + encodeURIComponent(s.assignment_id) + '&period=' + s.period + '&date=' + today + '">Mark</a>') + '</td></tr>';
  }).join('') + '</tbody></table>' : '<p class="dim">No classes today.</p>';

  app.innerHTML = '<div class="card"><h2 style="margin-top:0;font-size:16px">Today\'s classes</h2>' + classes + '</div>' +
    '<div class="grid">' +
    '<a class="card" href="marks.html" style="text-decoration:none;color:inherit"><div class="dim">Marks not published yet</div><div class="big">' + drafts + '</div></a>' +
    '<a class="card" href="mentees.html" style="text-decoration:none;color:inherit"><div class="dim">Profile edit requests waiting</div><div class="big">' + requests + '</div></a>' +
    '</div>';
})();
</script>
</body>
</html>
