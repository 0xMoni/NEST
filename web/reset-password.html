<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEST · Set a new password</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Newsreader:ital,wght@0,300;0,400;1,300&display=swap">
<link rel="stylesheet" href="css/login.css">
<script>try { var t = localStorage.getItem('nest-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body>
<div class="page">
  <section class="brand" id="brand">
    <canvas class="weave" id="weave" aria-hidden="true"></canvas>
    <img class="logo" src="assets/nest-logo.png" alt="NEST — Nurturing Education and Student Tracking" width="274" height="246">
    <h2 class="statement">Every class, every mark, every student — <em>in one place.</em></h2>
    <p class="brandFoot">© 2026 NEST</p>
  </section>

  <section class="side">
    <button type="button" class="theme" id="theme" title="Switch theme" aria-label="Switch theme"></button>
    <div class="formWrap" id="wrap">
      <h1 class="title rise" id="h">Set a new password</h1>
      <p class="lede rise d1" id="lede">Checking your link…</p>
      <form class="form" id="tap" hidden>
        <button type="submit" class="submit" id="cont">Continue</button>
        <div class="row"><span class="lede" style="margin:0;font-size:.8125rem">Didn't ask for this? Close the page and nothing changes.</span></div>
      </form>
      <form class="form" id="f" novalidate hidden>
        <div class="alert" id="alert" role="alert" aria-live="polite" hidden>
          <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.4v4.3M8 11.2v.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span id="alertText"></span>
        </div>
        <div class="field rise d1">
          <label for="pw1">New password</label>
          <div class="control hasToggle">
            <input type="password" id="pw1" autocomplete="new-password" minlength="6" required>
            <button type="button" class="reveal" aria-label="Show password">Show</button>
          </div>
        </div>
        <div class="field rise d2">
          <label for="pw2">Type it again</label>
          <div class="control"><input type="password" id="pw2" autocomplete="new-password" minlength="6" required></div>
        </div>
        <button type="submit" class="submit rise d4" id="go">Save password</button>
      </form>
    </div>
  </section>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
(async function () {
  var $ = NEST.$, sb = NEST.sb;
  // Same rules everywhere a password is set.
  function checkNew(a, b) {
    if (a.length < 6) return 'Use at least 6 characters.';
    if (a !== b) return "Those two don't match.";
    if (a === '123456') return "That's the default everyone starts with. Pick something else.";
    return null;
  }
  // Setting your own password is what clears the "must change" flag. It runs
  // on your own session, so nobody can clear anyone else's.
  async function setPassword(me, a) {
    var r = await NEST.sb.auth.updateUser({ password: a });
    if (r.error) return r.error.message;
    var p = await NEST.sb.from('profiles').update({ must_change_password: false }).eq('id', me.id);
    if (p.error) return 'Your password changed, but the account could not be updated: ' + p.error.message;
    return null;
  }
  function expired() { location.replace('forgot-password.html?expired=1'); }

  var q = new URLSearchParams(location.search);
  var hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (hash.get('error') || hash.get('error_code')) return expired();

  // A token in the link is single use, and email scanners and click trackers
  // follow links before the person does. So nothing is spent until someone
  // presses Continue: scanners follow links, they do not submit forms.
  var tokenHash = q.get('token_hash'), code = q.get('code');
  if (tokenHash || code) {
    $('h').textContent = 'One more tap';
    $('lede').textContent = 'You asked to reset your NEST password. Continue, and you can choose a new one.';
    $('tap').hidden = false;
    $('tap').addEventListener('submit', async function (e) {
      e.preventDefault();
      var b = $('cont'); b.disabled = true; b.textContent = 'Checking…';
      var r = tokenHash ? await sb.auth.verifyOtp({ type: 'recovery', token_hash: tokenHash })
                        : await sb.auth.exchangeCodeForSession(code);
      if (r.error) return expired();
      history.replaceState(null, '', location.pathname); // the token is spent; keep it out of history
      showForm();
    });
    return;
  }

  // The stock Supabase email signs the person in before they arrive, and the
  // client picks the session up from the address. Without one, the link is dead.
  var s = await sb.auth.getSession();
  if (!s.data.session) return expired();
  if (location.hash) history.replaceState(null, '', location.pathname);
  showForm();

  async function showForm() {
    var me = await NEST.getMe();
    if (!me) return expired();
    $('h').textContent = 'Set a new password';
    $('lede').textContent = 'This link signed you in' + (me.full_name ? ' as ' + me.full_name : '') + '. Choose a password and it will be the one you use from now on.';
    $('tap').hidden = true; $('f').hidden = false; $('pw1').focus();
    $('f').addEventListener('submit', async function (e) {
      e.preventDefault(); AUTH.hide();
      var a = $('pw1').value, b = $('pw2').value, bad = checkNew(a, b);
      if (bad) return AUTH.fail(bad, a.length < 6 || a === '123456' ? $('pw1') : $('pw2'));
      var go = $('go'); go.disabled = true; go.textContent = 'Saving…';
      var err = await setPassword(me, a);
      if (err) { go.disabled = false; go.textContent = 'Save password'; return AUTH.fail(err, $('pw1')); }
      location.replace(NEST.homeFor(me.role));
    });
  }
})();
</script>
</body>
</html>
