    <text x="30" y="137" font-size="10.5" fill="#475569">East Point College of Engineering &amp; Technology | CGPA: 8.6 / 10.0</text>
    <text x="580" y="137" text-anchor="end" font-size="10" font-weight="600" fill="#047857">Department Rank 4</text>

