    <text x="10" y="32" font-size="9" fill="#047857">"Accomplished [X] measured by [Y] doing [Z]"</text>
    <text x="10" y="44" font-size="9" fill="#047857">Every bullet has concrete numbers (%, ms, users).</text>
  </g>

  <!-- Callout 4: Verified Proof -->
  <g transform="translate(60, 695)">
    <rect width="240" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2" />
    <text x="10" y="18" font-size="10" font-weight="700" fill="#065f46">✅ LIVE DEMO &amp; REPO LINKS</text>
    <text x="10" y="32" font-size="9" fill="#047857">Verified project links prove authentic</text>
