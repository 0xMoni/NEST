    <text x="30" y="313" class="txt">• <tspan class="bold">Automated</tspan> CI/CD pipeline using GitHub Actions and Docker, reducing production build deployment cycles from 45 min to <tspan class="bold">11 min</tspan>.</text>
    <text x="30" y="329" class="txt">• <tspan class="bold">Spearheaded</tspan> migration of 8 legacy REST endpoints to TypeScript, preventing <tspan class="bold">95%</tspan> of runtime schema validation errors.</text>

    <!-- SECTION 4: PROJECTS -->
    <line x1="30" y1="344" x2="580" y2="344" stroke="#047857" stroke-width="1.5" />
    <text x="30" y="358" class="h2">FEATURED PROJECTS</text>
    
    <text x="30" y="376" font-size="11" font-weight="700" fill="#0f172a">NestFlow — Real-time Student Mentorship Platform</text>
    <text x="580" y="376" text-anchor="end" font-size="10" fill="#2563eb">[Live Demo ↗] | [GitHub ↗]</text>
