  <circle cx="50" cy="45" r="14" fill="#10b981" />
  <text x="50" y="50" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">✓</text>
  <text x="75" y="42" font-size="14" font-weight="700" fill="#065f46">TOP 1% MARKET BENCHMARK (ATS Score: 98/100)</text>
  <text x="75" y="57" font-size="11" fill="#047857">FAANG / Top-Tier Standard: Single column, Google X-Y-Z formula, live links, quantified impact</text>

