    <text x="305" y="40" text-anchor="middle" class="h1">ROHAN SHARMA</text>
    <text x="305" y="58" text-anchor="middle" font-size="10.5" fill="#475569">
      Bengaluru, India | +91 98765 43210 | rohan.sharma@college.edu
    </text>
    <text x="305" y="73" text-anchor="middle" font-size="10.5" fill="#2563eb">
      linkedin.com/in/rohansharma | github.com/rohansharma-dev | rohansharma.dev
    </text>

