    <text x="30" y="410" class="txt">• <tspan class="bold">Engineered</tspan> an automated attendance &amp; marks engine with PostgreSQL Row-Level Security, serving <tspan class="bold">500+ active department users</tspan>.</text>
    <text x="30" y="426" class="txt">• <tspan class="bold">Integrated</tspan> an AI-driven career roadmap generator with structured JSON schema outputs, achieving <tspan class="bold">&lt;850ms</tspan> average streaming response.</text>
    <text x="30" y="442" class="txt">• <tspan class="bold">Optimized</tspan> database queries with indexing and materialized views, cutting dashboard load times by <tspan class="bold">62%</tspan>.</text>

    <text x="30" y="468" font-size="11" font-weight="700" fill="#0f172a">Distributed E-Commerce Microservice</text>
    <text x="580" y="468" text-anchor="end" font-size="10" fill="#2563eb">[Live Demo ↗] | [GitHub ↗]</text>
    <text x="30" y="484" font-size="10" font-style="italic" fill="#64748b">Node.js, Express, MongoDB, Apache Kafka, Stripe API, Docker</text>
    <text x="30" y="502" class="txt">• <tspan class="bold">Designed</tspan> an event-driven inventory management service processing up to <tspan class="bold">1,200 orders/minute</tspan> with zero race condition oversells.</text>
    <text x="30" y="518" class="txt">• <tspan class="bold">Implemented</tspan> idempotent Stripe payment webhooks with exponential backoff retries, ensuring <tspan class="bold">99.99%</tspan> transaction delivery accuracy.</text>

