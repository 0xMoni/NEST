  <!-- GREEN ANNOTATION CALLOUT CARDS -->
  <!-- Callout 1: 100% Parsable Single Column -->
  <g transform="translate(60, 205)">
    <rect width="240" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2" />
    <text x="10" y="18" font-size="10" font-weight="700" fill="#065f46">✅ 100% ATS PARSER COMPLIANT</text>
    <text x="10" y="32" font-size="9" fill="#047857">Single-column flow passes every ATS</text>
    <text x="10" y="43" font-size="9" fill="#047857">system (Taleo, Greenhouse, Workday).</text>
  </g>

