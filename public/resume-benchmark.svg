    <text x="30" y="567" class="txt">• <tspan class="bold">AWS Certified Cloud Practitioner</tspan> (Amazon Web Services, Credential ID: AWS-8923491) — 2024</text>
    <text x="30" y="583" class="txt">• <tspan class="bold">Winner (1st of 64 teams):</tspan> State-level Smart India Hackathon for AI Emergency Response Portal — 2024</text>
    <text x="30" y="599" class="txt">• <tspan class="bold">LeetCode:</tspan> 450+ DSA problems solved (Knight Tier, Top 6% global ranking, Max Rating 1940)</text>
