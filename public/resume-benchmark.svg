    <text x="30" y="279" font-size="11" font-weight="700" fill="#0f172a">Software Engineering Intern <tspan font-weight="400" fill="#475569">| TechScale Solutions</tspan></text>
    <text x="580" y="279" text-anchor="end" font-size="10.5" fill="#475569">June 2024 – Aug 2024</text>
