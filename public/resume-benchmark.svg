    <text x="10" y="18" font-size="10" font-weight="700" fill="#065f46">✅ CATEGORIZED KEYWORDS</text>
    <text x="10" y="32" font-size="9" fill="#047857">Clear separation of languages, tools, and</text>
    <text x="10" y="44" font-size="9" fill="#047857">cloud allows automated boolean keyword match.</text>
  </g>

  <!-- Callout 3: Google X-Y-Z Formula -->
  <g transform="translate(370, 520)">
    <rect width="265" height="52" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2" />
