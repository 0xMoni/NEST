<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 920" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .bg { fill: #ffffff; }
      .sheet { fill: #ffffff; filter: drop-shadow(0 4px 20px rgba(0,0,0,0.08)); }
      .tag-good { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; rx: 6; }
      .tag-good-text { font-size: 11px; font-weight: 600; fill: #047857; }
      .h1 { font-size: 22px; font-weight: 700; fill: #0f172a; letter-spacing: -0.02em; }
      .h2 { font-size: 11px; font-weight: 700; fill: #047857; text-transform: uppercase; letter-spacing: 0.08em; }
      .txt { font-size: 10.5px; fill: #334155; line-height: 1.45; }
      .bold { font-weight: 700; fill: #0f172a; }
      .link { fill: #2563eb; font-weight: 500; text-decoration: underline; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="700" height="920" fill="#f8fafc" rx="12" />

  <!-- Card Header -->
