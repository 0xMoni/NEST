    <text x="30" y="184" class="txt"><tspan class="bold">Languages:</tspan> Python, Java, TypeScript, JavaScript, SQL (PostgreSQL), C++</text>
    <text x="30" y="200" class="txt"><tspan class="bold">Frameworks &amp; Libs:</tspan> React 19, Next.js 15, Node.js, Express, Fastify, Tailwind CSS</text>
